name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: .\windows\build_windows.ps1 -BuildInstaller

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE 'dist/installer/CE2026Dashboard-Setup.exe'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Expected installer was not created: $installer"
          }
          Write-Host "Installer ready: $installer"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CE2026Dashboard-Windows-Installer
          path: dist/installer/CE2026Dashboard-Setup.exe
          if-no-files-found: error
          compression-level: 6
